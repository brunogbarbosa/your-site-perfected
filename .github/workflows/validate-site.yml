name: Validate website
on:
  push:
    branches: [main, codex/projeto-mulheres-de-axe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies remotely
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint changed project components
        run: npx eslint src/main.tsx src/ProjectsPage.tsx src/ProjectDetailPage.tsx src/TransparencyProjectsPage.tsx src/data/mulheresDeAxe.ts src/components/MulheresDeAxeBudget.tsx --rule 'prettier/prettier: off'
      - name: Production build
        run: npm run build
      - name: Install visual verification tools remotely
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify project pages on desktop and mobile
        run: node .github/scripts/verify-project.mjs
      - name: Save remote visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mulheres-de-axe-review
          path: artifacts
          retention-days: 7
